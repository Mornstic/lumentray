name: 功能建议
description: 提出新的功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。LumenTray 的 v1 范围集中在「把亮度调顺手」，对比度、输入源、色温、HDR 等暂不在计划内；提交前请先确认 README 的范围说明。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的使用方式哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如果有参考软件或截图可以附上。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我已搜索已有 Issue，确认没有重复建议
          required: true

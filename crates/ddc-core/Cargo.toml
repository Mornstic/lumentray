[package]
name = "ddc-core"
version = "0.1.0"
description = "Windows DDC/CI monitor enumeration and brightness control"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
